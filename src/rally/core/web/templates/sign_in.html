{% extends "base.html" %}
{% block title %}Sign in to Rally{% endblock %}
{% block content %}
<h1>Sign in</h1>

<form method="post" action="{% url 'sign_in' %}" novalidate>
  {% csrf_token %}
  {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
  {% include "_form_errors.html" %}

  <div class="field">
    <label for="id_email">Email address</label>
    <input type="text" name="email" id="id_email" autocomplete="email"
           value="{{ form.email.value|default_if_none:'' }}">
  </div>

  <div class="field">
    <label for="id_password">Password</label>
    <input type="password" name="password" id="id_password" autocomplete="current-password">
  </div>

  <button type="submit" class="button">Sign in</button>
</form>

<p class="aside">New to Rally? <a href="{% url 'register' %}">Create an account</a>.</p>
{% endblock %}
